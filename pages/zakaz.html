<form action="" class="wedding">
<div class="form-inner">
  <title>Промдеталь ЕКБ</title>  
  <style type="text/css">

    
    * {
   box-sizing: border-box;
}
body {
   background: #FFF2E3;
}
.wedding {
   position: relative;
   max-width: 520px;
   margin: 50px auto 0;
   text-align: center;
}
.form-inner:before {
   display: inline-block;
   margin-top: -45px;
}
.form-inner {
   padding: 0 40px 10px;
   margin-top: 45px;
   background: #ffffff;
   border-radius: 2px;
   box-shadow: 0 0 6px 1px rgba(0, 0, 0, .1);
}
.form-inner h2 {
  padding-top: 20px;
   font-weight: 300;
   font-size: 20px;
   text-transform: uppercase;
   font-family: 'Cormorant Garamond', serif;
}
.form-content {
   position: relative;
   margin: 30px -40px 0 -40px;
   padding: 10px 40px 0 40px;
   background: #FFF8F3;
}
.form-content:before {
   content: "";
   position: absolute;
   top: -4px;
   right: 0;
   left: 0;
   height: 2px;
   border-top: 1px solid #DDDDDD;
   border-bottom: 1px solid #DDDDDD;
}
.form-content h3 {
   font-family: 'Marck Script', cursive;
   font-size: 22px;
   color: #898989;
   font-weight: normal;
}
.form-content input, .form-content select {
   height: 38px;
   line-height: 38px;
   padding: 0 10px;
   background: #ffffff;
   border: 1px solid #DDDDDD;
   font-size: 20px;
   font-family: 'Cormorant Garamond', serif;
   color: #808080;
   outline: none;
}
.form-content input {
   width: 100%;
}
.form-content input:focus, .form-content select:focus {
   border-color: #C44D58;
}
.form-content input[type="submit"] {
   margin: 20px 0;
   padding: 0 10px;
   background: #FF6B6B;
   color: #ffffff;
   font-size: 18px;
   text-transform: uppercase;
   border-width: 0;
   border-radius: 20px;
   cursor: pointer;
   transition: .2s linear
}
.form-content input[type="submit"]:hover {
   background: #C44D58;
}
  </style>
<h2 >Оформление заказа<br></h2>
<div class="form-content">
<h3>Фамилия:</h3>
<p><input type="text" name="your-name" ></p>
<h3>Имя:</h3>
<p><input type="text" name="your-name" ></p>
<h3>Отчество:</h3>
<p><input type="text" name="your-name" ></p>
<h3>Вид работ:</h3>
<p>
<select name="guests">
<option value="1">Декор ворот и изгородей</option>
<option value="2">Работы по дереву в интерьерах</option>
<option value="3">Создание обьемных букв и логотипов</option>
<option value="4">Лазерная резка металла</option>
<option value="5">Лазерная резка неметаллов</option>
</select>
</p>
<h3>Дата заказа</h3>
<p>
                
                <input type="date" id="date" name="date"/>
            </p>
<p><input type="submit" value="Заказать"></p>
</div>
</div>
</form>
